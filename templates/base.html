<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Prometeus | O teu Itsm favorito!</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" href="#">ITSM</a>
    </div>
</nav>

<div class="container mt-4">

    <!-- Indicadores -->
    <div class="row mb-4">
        <div class="col-md-4">
            <div class="card text-center">
                <div class="card-body">
                    <h5>Chamados Abertos</h5>
                    <h2>12</h2>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card text-center">
                <div class="card-body">
                    <h5>Em Andamento</h5>
                    <h2>8</h2>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card text-center">
                <div class="card-body">
                    <h5>Resolvidos</h5>
                    <h2>35</h2>
                </div>
            </div>
        </div>
    </div>

    <!-- Tabela de chamados -->
    <div class="card mb-4">
        <div class="card-header">
            Chamados
        </div>
        <div class="card-body">
            <table class="table table-striped">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Título</th>
                        <th>Prioridade</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>1001</td>
                        <td>Falha de login</td>
                        <td><span class="badge bg-danger">Alta</span></td>
                        <td>Aberto</td>
                    </tr>
                    <tr>
                        <td>1002</td>
                        <td>Instalação de software</td>
                        <td><span class="badge bg-warning">Média</span></td>
                        <td>Em andamento</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Novo Chamado -->
    <div class="card">
        <div class="card-header">
            Abrir Chamado
        </div>
        <div class="card-body">
            <form>
                <div class="mb-3">
                    <label class="form-label">Título</label>
                    <input type="text" class="form-control">
                </div>

                <div class="mb-3">
                    <label class="form-label">Descrição</label>
                    <textarea class="form-control" rows="4"></textarea>
                </div>

                <div class="mb-3">
                    <label class="form-label">Prioridade</label>
                    <select class="form-select">
                        <option>Baixa</option>
                        <option>Média</option>
                        <option>Alta</option>
                    </select>
                </div>

                <button type="submit" class="btn btn-primary">
                    Criar Chamado
                </button>
            </form>
        </div>
    </div>

</div>

</body>
</html>
